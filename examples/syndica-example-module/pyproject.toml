[project]
name = "syndica-example-module"
version = "0.1.0"
description = "A minimal third-party Syndica module: one flag, one tool, one plugin on its own extension junction"
requires-python = ">=3.11"
dependencies = ["syndica"]

[project.entry-points."syndica.modules"]
example = "syndica_example_module:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syndica_example_module"]
