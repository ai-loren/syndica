# 本仓自己的开发配置：syndica run --handoff --topology syndica-dev "<需求>"
# 角色与流程见 docs/plans/2026-09-30-m2-self-hosting.md 的 D17，受保护路径见 D15。
version: 1

workspace:
  # 与 CI 的门禁逐字一致（tests/cli/test_repo_config.py 钉住）。
  verify:
    - uv run ruff format --check .
    - uv run ruff check .
    - uv run pyright
    - uv run python scripts/check_deps.py
    - uv run python scripts/check_links.py
    - uv run pytest -q
  # 这些文件决定「检查通过」是什么意思：Agent 改了它们，--git-mode 拒绝提交，交互询问时醒目列出。
  protected:
    - pyproject.toml
    - uv.lock
    - uv.toml
    - .python-version
    - "**/conftest.py"
    - pytest.ini
    - .pytest.ini
    - pyrightconfig.json
    - "**/ruff.toml"
    - "**/.ruff.toml"
    - setup.cfg
    - tox.ini
    - "scripts/**"
    - .syndica.yaml
    - "docs/agents/**"
    - ".github/**"
    - AGENTS.md

agents:
  - name: Planner
    description: 划定范围、要改的文件、验证方式与成功判据时用我；我不改文件
    system_prompt: docs/agents/planner.md
    tools: [Read, Grep, Glob]
    budget: {turns: 8}
  - name: Explorer
    description: 定位文件、符号、调用点与相关测试时用我；我不改文件
    system_prompt: docs/agents/explorer.md
    tools: [Read, Grep, Glob]
    budget: {turns: 10}
  - name: Worker
    description: 改文件、跑检查、用检查结果验证时用我
    system_prompt: docs/agents/worker.md
    tools: [Read, Grep, Glob, Write, Edit, Bash, BashOutput, KillBash]
    budget: {turns: 24}
  - name: Reviewer
    description: Worker 改完之后审改动时用我；我不改文件，最后一行给出 verdict
    system_prompt: docs/agents/reviewer.md
    tools: [Read, Grep, Glob, Bash]
    budget: {turns: 10}
  - name: Orchestrator
    description: 把一项改动按 Planner、Explorer、Worker、Reviewer 推进到可以交接，自己不改文件
    impl: syndica.kernel.agents.orchestrator:Orchestrator
    system_prompt: docs/agents/orchestrator.md
    subagents: [Planner, Explorer, Worker, Reviewer]
    budget: {turns: 24}

topologies:
  syndica-dev:
    slots:
      - {name: root, agent: Orchestrator, is_root: true, cardinality: singleton}
