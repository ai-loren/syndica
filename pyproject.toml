[project]
name = "syndica"
version = "0.0.0"
description = "A multi-agent harness for verifiable knowledge work"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Loren Zhang" }]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syndica"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs 里的代码块是需求源文本，实现者逐字誊抄；formatter 重排它们会篡改需求。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
# 必须用顶层 strict 路径列表：pyright 在 executionEnvironments 里不认 typeCheckingMode，
# 改写成那种形式会让 src 静默降级为 standard。
typeCheckingMode = "standard"
strict = ["src"]
