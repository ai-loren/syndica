[project]
name = "syndica"
# 版本号只写在这里：`syndica.__version__` 与 `syndica --version` 从装好的发行版元数据读它。
version = "1.0.0rc1"
description = "A multi-agent harness for verifiable knowledge work"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Loren Zhang" }]
keywords = [
    "agents",
    "multi-agent",
    "llm",
    "agent-harness",
    "knowledge-work",
    "asyncio",
    "mcp",
    "acp",
    "a2a",
    "training-data",
]
# 只声明 Linux 与 macOS：进程组、setsid、伪终端没有 Windows 分支，Windows 用户走 WSL2。
# 许可证由 `license` 的 SPDX 表达式给出，不再加 License :: 分类（PEP 639 下两者并存会被拒）。
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.0", "PyYAML>=6.0"]

# 文档站上线之前，Documentation 指向仓库里的英文用户文档目录；站点地址定下来后换成它。
[project.urls]
Homepage = "https://github.com/ai-loren/syndica"
Repository = "https://github.com/ai-loren/syndica"
Issues = "https://github.com/ai-loren/syndica/issues"
Changelog = "https://github.com/ai-loren/syndica/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ai-loren/syndica/tree/main/docs/user"

[project.scripts]
syndica = "syndica.__main__:entrypoint"

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "pyright>=1.1",
    "openai>=3.26,<4",
]
openai = ["httpx>=0.27"]
otel = ["httpx>=0.27"]
server = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
]
mcp = ["mcp>=2.3,<3", "jsonschema>=4"]
acp = ["agent-client-protocol>=0.12,<0.13"]
a2a = ["a2a-sdk[http-server]>=1.2,<2"]
trl = ["trl>=1.15", "datasets>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syndica"]

# sdist 只装重建 wheel 要的东西（`uv build` 的 wheel 就是从 sdist 构建的）。测试不进：套件读 docs/、
# scripts/、web/、examples/ 与 .github/，只带 tests/ 得到的是一套跑不通的用例；要跑测试用打了标签的
# 仓库归档。前端源码不进：wheel 里是 src/syndica/server/static 下已提交的构建产物。
[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# 挂死类缺陷已出现两次（broker 的 timeout=None 永久 park、事件流的非让出空转）。
# 没有全局超时，这类回归表现为 CI 无输出地跑到平台上限，而不是一条红色断言。
timeout = 60
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"
# docs 里的代码块是需求源文本，实现者逐字誊抄；formatter 重排它们会篡改需求。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# ASYNC109（「别收 timeout 参数，让调用方套 asyncio.timeout」）与 MessageBroker 的等待上限
# 冲突：远端实现要把 timeout 下推给服务端（Redis XREAD BLOCK），本地取消域只会把已阻塞的
# 服务端连接留在那里。签名由 spec §4.4 固定，因此按文件豁免而不是全局关掉这条规则。
"src/syndica/kernel/protocols/broker.py" = ["ASYNC109"]
"src/syndica/kernel/stores/memory_broker.py" = ["ASYNC109"]
"src/syndica/runner/replay_broker.py" = ["ASYNC109"]
# Portal.run 的 timeout 要下推给子进程；调用方套 asyncio.timeout 杀不掉已经拉起的进程组。
"src/syndica/kernel/workspace.py" = ["ASYNC109"]
"src/syndica/kernel/local_workspace.py" = ["ASYNC109"]
"src/syndica/kernel/workspace_router.py" = ["ASYNC109"]
"src/syndica/kernel/tools/local.py" = ["ASYNC109"]
# Human tools expose a waiter timeout that Runtime forwards to the broker.
"src/syndica/kernel/tools/human.py" = ["ASYNC109"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["src", "tests", "scripts", "examples"]
pythonVersion = "3.11"
# strict 必须使用顶层路径列表；executionEnvironments 不支持 typeCheckingMode。
typeCheckingMode = "standard"
strict = ["src"]
